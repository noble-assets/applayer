[workspace]
resolver = "2"
members  = ["crates/noble-node", "crates/noble-evm"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
reth-ethereum              = { git = "https://github.com/paradigmxyz/reth", tag = "v1.7.0", features = ["cli", "node"] }
reth-cli-util              = { git = "https://github.com/paradigmxyz/reth", tag = "v1.7.0" }
reth-revm                  = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.7.0" }
reth-ethereum-forks        = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.7.0" }
reth-basic-payload-builder = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.7.0" }
reth-payload-builder       = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.7.0" }
reth-provider              = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.7.0" }
ev-node                    = { git = "https://github.com/evstack/ev-reth", rev = "d2f9e64" }
evolve-ev-reth             = { git = "https://github.com/evstack/ev-reth", rev = "d2f9e64" }
ev-revm                    = { git = "https://github.com/evstack/ev-reth", rev = "d2f9e64" }
alloy-primitives           = { version = "1.3.1", default-features = false }
alloy-evm                  = { version = "0.20.1", default-features = false }
tracing                    = "0.1"
eyre                       = "0.6"
tokio                      = { version = "1.38", features = ["full"] }
